name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # lets you start a build by hand from the Actions tab

permissions:
  contents: write      # needed to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing the KEYSTORE_PASSWORD repository secret. See README, 'Automatic updates'."
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing the KEYSTORE_BASE64 and KEYSTORE_PASSWORD repository secrets. See README, 'Automatic updates'."
            exit 1
          fi
          # Tolerate spaces and line breaks picked up when pasting the secret.
          clean=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t')
          if ! printf '%s' "$clean" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid: got ${#clean} characters, expected 5712. Paste the whole of signing/KEYSTORE_BASE64.txt again."
            exit 1
          fi

      - name: Build release APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGNING_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "TaobaoTranslate-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TaobaoTranslate-apk
          path: TaobaoTranslate-*.apk

      # Obtainium on the phone watches these releases and installs new versions.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B > notes.txt
          gh release create "v1.0.${{ github.run_number }}" TaobaoTranslate-*.apk \
            --title "1.0.${{ github.run_number }}" --notes-file notes.txt
